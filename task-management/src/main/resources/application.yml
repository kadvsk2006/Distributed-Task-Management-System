server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/task_management;
    username: postgres
    password: youpassword 

  flyway:
    baselineOnMigrate: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
